[package]
name = "seismic-handler"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wit-bindgen = { version = "0.30", default-features = false }

[profile.release]
opt-level = "s"
lto = true
strip = true

[package.metadata.component]
package = "wasmcloud:seismic-handler"

[package.metadata.component.target]
path = "wit"
